<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="680" fill="#f8f9fa" rx="8"/>
  <text x="380" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Domain Connect — Asynchronous (OAuth) Flow</text>

  <!-- Actor header boxes -->
  <rect x="20"  y="44" width="150" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="95"  y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">User / Browser</text>

  <rect x="295" y="44" width="170" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Service Provider</text>

  <rect x="575" y="44" width="165" height="42" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="657" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DNS Provider</text>
  <text x="657" y="78" text-anchor="middle" font-size="11" fill="#166534">OAuth Server + API</text>

  <!-- Lifelines: user=95, sp=380, dnsp=657 -->
  <line x1="95"  y1="86" x2="95"  y2="650" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="380" y1="86" x2="380" y2="650" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="657" y1="86" x2="657" y2="650" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Collapsed steps 1–9 band -->
  <rect x="20" y="96" width="720" height="32" rx="4" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="380" y="116" text-anchor="middle" font-size="11" fill="#4338ca">Steps ①–⑨ identical to synchronous flow (discovery, redirect, login, zone ownership check)</text>

  <!-- ⑩ DNSP → User: consent for FUTURE changes  y=160 -->
  <text x="376" y="146" text-anchor="middle" font-size="11" fill="#374151">⑩ Consent screen: grant access for FUTURE DNS changes</text>
  <line x1="650" y1="154" x2="102" y2="154" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#b)"/>

  <!-- ⑪ User → DNSP: approve OAuth scope  y=200 -->
  <text x="376" y="186" text-anchor="middle" font-size="11" fill="#374151">⑪ User approves OAuth scope (template + domain scoped)</text>
  <line x1="102" y1="194" x2="650" y2="194" stroke="#374151" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- ⑫ DNSP → SP: redirect with auth code  y=240 -->
  <text x="518" y="226" text-anchor="middle" font-size="11" fill="#374151">⑫ Redirect with authorization code</text>
  <line x1="650" y1="234" x2="387" y2="234" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#b)"/>

  <!-- ⑬ SP → DNSP: exchange code for token  y=280 -->
  <text x="518" y="266" text-anchor="middle" font-size="11" fill="#374151">⑬ Exchange code for access token (server-to-server)</text>
  <line x1="387" y1="274" x2="650" y2="274" stroke="#374151" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- ⑭ DNSP → SP: access token  y=320 -->
  <text x="518" y="306" text-anchor="middle" font-size="11" fill="#374151">⑭ Access token (scoped to template + domain)</text>
  <line x1="650" y1="314" x2="387" y2="314" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#b)"/>

  <!-- ⑮ SP → User: notify setup in progress  y=360 -->
  <text x="237" y="346" text-anchor="middle" font-size="11" fill="#374151">⑮ User notified — setup in progress</text>
  <line x1="373" y1="354" x2="102" y2="354" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#b)"/>

  <!-- Divider: user no longer present -->
  <line x1="20" y1="376" x2="740" y2="376" stroke="#9ca3af" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="380" y="392" text-anchor="middle" font-size="10" fill="#9ca3af" font-style="italic">— User no longer present — SP operates in background —</text>

  <!-- ⑯ SP → DNSP: POST apply  y=420 -->
  <text x="518" y="412" text-anchor="middle" font-size="11" fill="#7c3aed">⑯ POST apply (access token in header)</text>
  <line x1="387" y1="420" x2="650" y2="420" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#purp)"/>

  <!-- ⑰ DNSP internal: DNS written  box y=434–462 -->
  <rect x="575" y="432" width="165" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="657" y="451" text-anchor="middle" font-size="11" fill="#166534" font-weight="bold">⑰ DNS records written to zone</text>

  <!-- ⑱ SP → DNSP: repeat for each phase  y=500 -->
  <text x="518" y="484" text-anchor="middle" font-size="11" fill="#7c3aed">⑱ Repeat for each phase / group (no user needed)</text>
  <line x1="657" y1="466" x2="657" y2="492" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="387" y1="492" x2="650" y2="492" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#purp)"/>

  <!-- ⑲ SP → User: async notify  y=542 -->
  <text x="237" y="526" text-anchor="middle" font-size="11" fill="#374151">⑲ Async notify: all DNS configured</text>
  <line x1="373" y1="534" x2="102" y2="534" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#b)"/>

  <!-- Footer note -->
  <rect x="20" y="560" width="720" height="30" rx="5" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="380" y="579" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">Token is scoped to the specific template and domain only — SP cannot modify any other DNS records.</text>

  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
    <marker id="purp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
