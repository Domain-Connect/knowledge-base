<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="760" height="220" fill="#f8f9fa" rx="8"/>

  <!-- SaaS Service Provider box -->
  <rect x="20" y="30" width="200" height="160" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">SaaS Service Provider</text>
  <line x1="20" y1="66" x2="220" y2="66" stroke="#3b82f6" stroke-width="1"/>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#1e40af">Knows what DNS records</text>
  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#1e40af">are needed, but cannot</text>
  <text x="120" y="120" text-anchor="middle" font-size="11" fill="#1e40af">write them directly</text>

  <!-- End User box -->
  <rect x="280" y="30" width="200" height="160" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">End User</text>
  <line x1="280" y1="66" x2="480" y2="66" stroke="#f59e0b" stroke-width="1"/>
  <text x="380" y="88" text-anchor="middle" font-size="11" fill="#78350f">Has no DNS skills</text>
  <text x="380" y="104" text-anchor="middle" font-size="11" fill="#78350f">or knowledge —</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#78350f">expected to translate</text>
  <text x="380" y="136" text-anchor="middle" font-size="11" fill="#78350f">between both sides</text>

  <!-- DNS Provider box -->
  <rect x="540" y="30" width="200" height="160" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="640" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">DNS Provider / Registrar</text>
  <line x1="540" y1="66" x2="740" y2="66" stroke="#22c55e" stroke-width="1"/>
  <text x="640" y="88" text-anchor="middle" font-size="11" fill="#14532d">Has full access to</text>
  <text x="640" y="104" text-anchor="middle" font-size="11" fill="#14532d">the DNS zone, but</text>
  <text x="640" y="120" text-anchor="middle" font-size="11" fill="#14532d">no idea what the</text>
  <text x="640" y="136" text-anchor="middle" font-size="11" fill="#14532d">service needs</text>

  <!-- Arrow SP → User -->
  <line x1="220" y1="110" x2="278" y2="110" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrow User → DNS Provider -->
  <line x1="480" y1="110" x2="538" y2="110" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Gap labels -->
  <text x="249" y="104" text-anchor="middle" font-size="10" fill="#9ca3af">gap</text>
  <text x="509" y="104" text-anchor="middle" font-size="10" fill="#9ca3af">gap</text>

  <!-- Bottom caption -->
  <text x="380" y="210" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">The user sits in the middle, expected to manually translate between two systems that never communicate directly.</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
