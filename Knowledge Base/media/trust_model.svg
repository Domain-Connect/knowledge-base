<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="340" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Domain Connect Three-Party Trust Model</text>

  <!-- DNS Provider (top) -->
  <rect x="240" y="45" width="220" height="72" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">DNS Provider</text>
  <text x="350" y="88" text-anchor="middle" font-size="11" fill="#14532d">Reviews, approves and deploys templates</text>
  <text x="350" y="104" text-anchor="middle" font-size="11" fill="#14532d">Authenticates user · Controls consent UI</text>

  <!-- Service Provider (bottom-left) -->
  <rect x="50" y="220" width="210" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Service Provider</text>
  <text x="155" y="263" text-anchor="middle" font-size="11" fill="#1e40af">Creates templates · Constructs</text>
  <text x="155" y="279" text-anchor="middle" font-size="11" fill="#1e40af">signed redirect URLs</text>

  <!-- End User (bottom-right) -->
  <rect x="440" y="220" width="210" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="545" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">End User</text>
  <text x="545" y="263" text-anchor="middle" font-size="11" fill="#78350f">Controls their own domain</text>
  <text x="545" y="279" text-anchor="middle" font-size="11" fill="#78350f">Gives explicit consent</text>

  <!-- Arrow: SP → DNS Provider (out-of-band vetting) -->
  <line x1="200" y1="220" x2="300" y2="118" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#blueArr)"/>
  <text x="218" y="171" text-anchor="middle" font-size="10" fill="#3b82f6" transform="rotate(-47,218,175)">template vetting</text>
  <text x="220" y="185" text-anchor="middle" font-size="10" fill="#3b82f6" transform="rotate(-47,220,185)">(out-of-band)</text>

  <!-- Arrow: DNS Provider → User (consent + auth) -->
  <line x1="400" y1="118" x2="510" y2="220" stroke="#22c55e" stroke-width="1.5" marker-end="url(#greenArr)"/>
  <text x="490" y="164" text-anchor="middle" font-size="10" fill="#16a34a" transform="rotate(46,490,168)">authenticates</text>
  <text x="480" y="178" text-anchor="middle" font-size="10" fill="#16a34a" transform="rotate(46,492,178)">+ gets consent</text>

  <!-- Arrow: SP → User (redirect URL) -->
  <line x1="262" y1="260" x2="438" y2="260" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#amberArr)"/>
  <text x="350" y="252" text-anchor="middle" font-size="10" fill="#b45309">signed redirect URL</text>

  <!-- Key legend -->
  <rect x="50" y="315" width="600" height="18" rx="4" fill="none"/>
  <line x1="60" y1="325" x2="90" y2="325" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="95" y="329" font-size="10" fill="#6b7280">out-of-band (template vetting)</text>
  <line x1="260" y1="325" x2="290" y2="325" stroke="#22c55e" stroke-width="1.5"/>
  <text x="295" y="329" font-size="10" fill="#6b7280">runtime trust flow</text>
  <line x1="430" y1="325" x2="460" y2="325" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="465" y="329" font-size="10" fill="#6b7280">browser redirect</text>

  <defs>
    <marker id="blueArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="greenArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="amberArr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
