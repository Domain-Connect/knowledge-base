<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="420" fill="#f8f9fa" rx="8"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Domain Connect Discovery Sequence</text>

  <!-- Actor boxes: sp=115, dns=360, dnsp=605 -->
  <rect x="40"  y="44" width="150" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Service Provider</text>

  <rect x="285" y="44" width="150" height="36" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="360" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">DNS</text>

  <rect x="530" y="44" width="150" height="36" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="605" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DNS Provider</text>
  <text x="605" y="74" text-anchor="middle" font-size="11" fill="#166534">API</text>

  <!-- Lifelines -->
  <line x1="115" y1="80" x2="115" y2="390" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="80" x2="360" y2="390" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="605" y1="80" x2="605" y2="390" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ① SP → DNS: TXT lookup  label y=104, arrow y=114 -->
  <text x="237" y="104" text-anchor="middle" font-size="11" fill="#374151">① TXT? _domainconnect.example.com</text>
  <line x1="122" y1="112" x2="353" y2="112" stroke="#374151" stroke-width="1.5" marker-end="url(#d)"/>

  <!-- DNS → SP: response  label y=142, arrow y=152 -->
  <text x="237" y="142" text-anchor="middle" font-size="11" fill="#374151">"api.domainconnect.dnsprovider.example"</text>
  <line x1="353" y1="150" x2="122" y2="150" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d)"/>

  <!-- ② SP → DNSP: GET settings  label y=198, arrow y=208 -->
  <text x="360" y="188" text-anchor="middle" font-size="11" fill="#374151">② GET /v2/example.com/settings</text>
  <line x1="122" y1="196" x2="598" y2="196" stroke="#374151" stroke-width="1.5" marker-end="url(#d)"/>

  <!-- DNSP → SP: settings JSON  label y=234, arrow y=244 -->
  <text x="360" y="228" text-anchor="middle" font-size="11" fill="#374151">{ urlSyncUX, urlAPI, providerName, … }</text>
  <line x1="598" y1="236" x2="122" y2="236" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d)"/>

  <!-- ③ SP → DNSP: template check  label y=282, arrow y=292 -->
  <text x="360" y="274" text-anchor="middle" font-size="11" fill="#374151">③ GET /v2/domainTemplates/providers/{id}/services/{id}</text>
  <line x1="122" y1="282" x2="598" y2="282" stroke="#374151" stroke-width="1.5" marker-end="url(#d)"/>

  <!-- DNSP → SP: 200 OK  label y=318, arrow y=328 -->
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#374151">200 OK — template deployed</text>
  <line x1="598" y1="324" x2="122" y2="324" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#d)"/>

  <!-- Result boxes -->
  <rect x="30"  y="352" width="230" height="30" rx="5" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="145" y="371" text-anchor="middle" font-size="11" fill="#166534" font-weight="bold">✓ Show "Connect automatically"</text>

  <rect x="460" y="352" width="230" height="30" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="575" y="371" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">✗ Show manual DNS instructions</text>

  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
