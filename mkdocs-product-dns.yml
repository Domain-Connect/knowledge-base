site_name: "Domain Connect — Product Edition: DNS Providers"
site_description: Product management knowledge base for DNS providers and registrars evaluating Domain Connect
site_author: Pawel Kowalik
site_url: !ENV SITE_URL

docs_dir: Knowledge Base
site_dir: docs/product-dns-kb

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Overview: 00_MASTER_product_dns.md
  - The Decision:
    - Business Case: Product/dns_01_business_case.md
    - Scope of Work: Product/dns_02_scope_of_work.md
    - Risks & Objections: Product/dns_03_risks_and_objections.md
    - Executive Brief: Product/dns_04_executive_brief.md
  - Background:
    - Context & Problem: 01_Problem_and_Context.md
    - What Is Domain Connect: 02_What_Is_Domain_Connect.md
    - How It Works: 03_How_It_Works.md
    - Use Cases: 05_Use_Cases.md
    - Value by Audience: 06_Value_by_Audience.md
    - Adoption & Ecosystem: 07_Adoption_and_Ecosystem.md
    - Security Model: 08_Security_Model.md
  - Hand-over to Engineering:
    - Implementation Guide: 12_Getting_Started_DNS_Provider.md
    - Getting Involved: 09_Getting_Involved.md
  - Stories:
    - CEO: Stories/dns_provider_ceo.md
    - Product Manager: Stories/dns_provider_pm.md
    - Support: Stories/dns_provider_support.md
    - Developer: Stories/dns_provider_dev.md

repo_url: https://github.com/Domain-Connect/knowledge-base
repo_name: Domain-Connect/knowledge-base

copyright: "Copyright &copy; 2026 Domain Connect Contributors. Content licensed under <a href='https://creativecommons.org/licenses/by/4.0/'>CC BY 4.0</a>."

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/domain-connect/
      name: Domain Connect on LinkedIn
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/domainconnect.bsky.social
      name: "@domainconnect.bsky.social on Bluesky"
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@domainconnect
      name: "@domainconnect@mastodon.social on Mastodon"
  edition_overview: 00_MASTER_product_dns.md

hooks:
  - hooks/edition.py
  - hooks/facts.py

watch:
  - data
