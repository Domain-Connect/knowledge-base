site_name: Domain Connect Knowledge Base
site_description: Knowledge base for the Domain Connect protocol
site_author: Pawel Kowalik

docs_dir: Root
site_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md

repo_url: https://github.com/Domain-Connect/knowledge-base
repo_name: Domain-Connect/knowledge-base

copyright: "Copyright &copy; 2026 Domain Connect Contributors. Content licensed under <a href='https://creativecommons.org/licenses/by/4.0/'>CC BY 4.0</a>."

extra:
  generator: false
